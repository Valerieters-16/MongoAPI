<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Course & Student Management</title>
  <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
    h1 { margin-bottom: 10px; }
    h2 { margin-top: 40px; }
    input, select, button { padding: 6px; margin: 4px; }
    table { border-collapse: collapse; width: 100%; margin-top: 10px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    tr:nth-child(even) { background-color: #f9f9f9; }
    .section { margin-bottom: 40px; }
    .enroll-section { background: #f5f5f5; padding: 10px; border-radius: 8px; }
  </style>
</head>

<body>
  <h1>📘 Course & Student Management</h1>
  <button id="seedBtn">Seed Demo Data</button>

  <div class="section">
    <h2>Courses</h2>
    <form id="courseForm">
      <input type="text" id="courseTitle" placeholder="Course Title" required />
      <input type="text" id="courseCode" placeholder="Course Code" required />
      <button type="submit">Add Course</button>
    </form>
    <table id="coursesTable">
      <thead><tr><th>Title</th><th>Code</th><th>Action</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="section">
    <h2>Students</h2>
    <form id="studentForm">
      <input type="text" id="studentName" placeholder="Student Name" required />
      <input type="email" id="studentEmail" placeholder="Email (optional)" />
      <button type="submit">Add Student</button>
    </form>
    <table id="studentsTable">
      <thead>
        <tr><th>Name</th><th>Email</th><th>Registered Courses</th><th>Action</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="section enroll-section">
    <h2>🎓 Register / Unregister Student in Course</h2>
    <form id="enrollForm">
      <select id="studentSelect" required></select>
      <select id="courseSelect" required></select>
      <button type="submit">Register</button>
      <button type="button" id="unregisterBtn">Unregister</button>
    </form>
  </div>


   <script src="app.js"></script>
</body>
</html>
