<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Course & Student Management</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    h1 { margin-bottom: 10px; }
    h2 { margin-top: 40px; }
    input, select, button { padding: 6px; margin: 4px; }
    table { border-collapse: collapse; width: 100%; margin-top: 10px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    tr:nth-child(even) { background-color: #f9f9f9; }
    .section { margin-bottom: 40px; }
    .enroll-section { background: #f5f5f5; padding: 10px; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>📘 Course & Student Management</h1>
  <button id="seedBtn">Seed Demo Data</button>

  <div class="section">
    <h2>Courses</h2>
    <form id="courseForm">
      <input type="text" id="courseTitle" placeholder="Course Title" required />
      <input type="text" id="courseCode" placeholder="Course Code" required />
      <button type="submit">Add Course</button>
    </form>
    <table id="coursesTable">
      <thead><tr><th>Title</th><th>Code</th><th>Action</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="section">
    <h2>Students</h2>
    <form id="studentForm">
      <input type="text" id="studentName" placeholder="Student Name" required />
      <input type="email" id="studentEmail" placeholder="Email (optional)" />
      <button type="submit">Add Student</button>
    </form>
    <table id="studentsTable">
      <thead>
        <tr><th>Name</th><th>Email</th><th>Registered Courses</th><th>Action</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="section enroll-section">
    <h2>🎓 Register / Unregister Student in Course</h2>
    <form id="enrollForm">
      <select id="studentSelect" required></select>
      <select id="courseSelect" required></select>
      <button type="submit">Register</button>
      <button type="button" id="unregisterBtn">Unregister</button>
    </form>
  </div>

  <script>
    // === CONFIG ===
    const API_BASE = "https://mongoapi-hnzx.onrender.com/api"; // ⚠️ if using Live Server, change to "http://localhost:3000/api"

    document.getElementById("seedBtn").addEventListener("click", async () => {
      await fetch(`${API_BASE}/seed`, { method: "POST" });
      loadAll();
    });

    // === COURSES ===
    async function loadCourses() {
      const res = await fetch(`${API_BASE}/courses`);
      const data = await res.json();
      const tbody = document.querySelector("#coursesTable tbody");
      const select = document.getElementById("courseSelect");
      tbody.innerHTML = "";
      select.innerHTML = "<option value=''>Select Course</option>";
      data.forEach(c => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${c.title}</td>
          <td>${c.code}</td>
          <td><button onclick="deleteCourse('${c._id}')">Delete</button></td>`;
        tbody.appendChild(tr);

        const opt = document.createElement("option");
        opt.value = c._id;
        opt.textContent = `${c.title} (${c.code})`;
        select.appendChild(opt);
      });
    }

    async function deleteCourse(id) {
      if (!confirm("Delete this course?")) return;
      await fetch(`${API_BASE}/courses/${id}`, { method: "DELETE" });
      loadAll();
    }

    document.getElementById("courseForm").addEventListener("submit", async e => {
      e.preventDefault();
      const title = document.getElementById("courseTitle").value;
      const code = document.getElementById("courseCode").value;
      await fetch(`${API_BASE}/courses`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title, code })
      });
      e.target.reset();
      loadAll();
    });

    // === STUDENTS ===
    async function loadStudents() {
      const res = await fetch(`${API_BASE}/students`);
      const data = await res.json();
      const tbody = document.querySelector("#studentsTable tbody");
      const select = document.getElementById("studentSelect");
      tbody.innerHTML = "";
      select.innerHTML = "<option value=''>Select Student</option>";
      data.forEach(s => {
        const courseList = (s.registeredCourses || [])
          .map(rc => `${rc.title} (${rc.code})`)
          .join(", ") || "<i>None</i>";
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${s.name}</td>
          <td>${s.email || "-"}</td>
          <td>${courseList}</td>
          <td><button onclick="deleteStudent('${s._id}')">Delete</button></td>`;
        tbody.appendChild(tr);

        const opt = document.createElement("option");
        opt.value = s._id;
        opt.textContent = s.name;
        select.appendChild(opt);
      });
    }

    async function deleteStudent(id) {
      if (!confirm("Delete this student?")) return;
      await fetch(`${API_BASE}/students/${id}`, { method: "DELETE" });
      loadAll();
    }

    document.getElementById("studentForm").addEventListener("submit", async e => {
      e.preventDefault();
      const name = document.getElementById("studentName").value;
      const email = document.getElementById("studentEmail").value;
      await fetch(`${API_BASE}/students`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, email })
      });
      e.target.reset();
      loadAll();
    });

    // === REGISTER / UNREGISTER ===
    document.getElementById("enrollForm").addEventListener("submit", async e => {
      e.preventDefault();
      const studentId = document.getElementById("studentSelect").value;
      const courseId = document.getElementById("courseSelect").value;
      if (!studentId || !courseId) return alert("Select both student and course");

      const res = await fetch(`${API_BASE}/students/${studentId}/register`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ courseId })
      });

      if (res.status === 409) {
        alert("Already registered in this course");
      } else if (!res.ok) {
        alert("Registration failed");
      }
      loadAll();
    });

    document.getElementById("unregisterBtn").addEventListener("click", async () => {
      const studentId = document.getElementById("studentSelect").value;
      const courseId = document.getElementById("courseSelect").value;
      if (!studentId || !courseId) return alert("Select both student and course");

      await fetch(`${API_BASE}/students/${studentId}/unregister`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ courseId })
      });
      loadAll();
    });

    async function loadAll() {
      await loadCourses();
      await loadStudents();
    }

    loadAll();
  </script>
</body>
</html>
