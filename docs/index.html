<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Course & Student Management</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="icon" href="data:,">
</head>

<body>
  <h1>📘 Course & Student Management</h1>
  <button id="seedBtn">Seed Demo Data</button>

  <div class="section">
    <h2>Courses</h2>
    <form id="courseForm">
      <input type="text" id="courseTitle" placeholder="Course Title" required />
      <input type="text" id="courseCode" placeholder="Course Code" required />
      <button type="submit">Add Course</button>
    </form>
    <table id="coursesTable">
      <thead><tr><th>Title</th><th>Code</th><th>Action</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="section">
    <h2>Students</h2>
    <form id="studentForm">
      <input type="text" id="studentName" placeholder="Student Name" required />
      <input type="email" id="studentEmail" placeholder="Email (optional)" />
      <button type="submit">Add Student</button>
    </form>
    <table id="studentsTable">
      <thead>
        <tr><th>Name</th><th>Email</th><th>Registered Courses</th><th>Action</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="section enroll-section">
    <h2>🎓 Register / Unregister Student in Course</h2>
    <form id="enrollForm">
      <select id="studentSelect" required></select>
      <select id="courseSelect" required></select>
      <button type="submit">Register</button>
      <button type="button" id="unregisterBtn">Unregister</button>
    </form>
  </div>

  <div id="editModal" class="modal">
  <div class="modal-content">
    <h3>Edit Student</h3>
    <label for="editName">Name:</label>
    <input type="text" id="editName" />

    <label for="editEmail">Email:</label>
    <input type="email" id="editEmail" />

    <div class="modal-buttons">
      <button id="saveEditBtn">Save</button>
      <button id="cancelEditBtn">Cancel</button>
    </div>
  </div>
</div>

   <script src="app.js"></script>
</body>
</html>
